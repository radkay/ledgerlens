name: Databricks integration
on:
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/integration.yml'
      - '.python-version'
      - 'CONTRACT.md'
      - 'databricks.yml'
      - 'provisioning/**'
      - 'pyproject.toml'
      - 'resources/**'
      - 'scripts/databricks_smoke.py'
      - 'src/**'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
           vars.LEDGERLENS_INTEGRATION_READY_DEV == 'true') ||
          (github.ref == 'refs/heads/main' &&
           vars.LEDGERLENS_INTEGRATION_READY_DEMO == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/dev' && 'ledgerlens-dev' || 'ledgerlens-demo' }}
    concurrency:
      group: ledgerlens-integration-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned runtime
        run: |
          python3 -m pip install uv==0.9.18
          uv sync --locked
      - name: Install pinned Databricks CLI
        uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55
        with:
          version: '1.28.0'
      - name: Deploy bundle and verify job and published Gold
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_processor_application_id: ${{ vars.DATABRICKS_PROCESSOR_APPLICATION_ID }}
          BUNDLE_VAR_evaluator_application_id: ${{ vars.DATABRICKS_EVALUATOR_APPLICATION_ID }}
          BUNDLE_TARGET: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'demo' }}
          LEDGERLENS_CATALOG: ${{ github.ref == 'refs/heads/dev' && 'ledgerlens_dev' || 'ledgerlens_demo' }}
        shell: bash
        run: |
          databricks bundle deploy --target "$BUNDLE_TARGET" --auto-approve
          summary=$(databricks bundle summary --target "$BUNDLE_TARGET" --output json)
          DATABRICKS_EVALUATION_JOB_ID=$(jq -er '.resources.jobs.evaluate.id | tostring | select(test("^[1-9][0-9]*$"))' <<< "$summary")
          export DATABRICKS_EVALUATION_JOB_ID
          files=$(jq -er '.workspace.file_path' <<< "$summary")
          job_id=$(jq -er '.resources.jobs.process.id | tostring | select(test("^[1-9][0-9]*$"))' <<< "$summary")
          directory=$(databricks workspace get-status "$files" --target "$BUNDLE_TARGET" --output json)
          directory_id=$(jq -er '.object_id' <<< "$directory")
          permissions=$(jq -n \
            --arg processor "$BUNDLE_VAR_processor_application_id" \
            --arg evaluator "$BUNDLE_VAR_evaluator_application_id" \
            '{access_control_list: ([$processor, $evaluator] | map({
              service_principal_name: ., permission_level: "CAN_READ"
            }))}')
          databricks workspace update-permissions directories "$directory_id" --target "$BUNDLE_TARGET" --json "$permissions" >/dev/null
          DATABRICKS_JOB_ID="$job_id" uv run --no-sync python scripts/databricks_smoke.py
