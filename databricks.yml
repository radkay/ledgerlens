bundle:
  name: ledgerlens
  databricks_cli_version: '1.28.0'

include:
  - resources/apps.yml
  - resources/jobs.yml

variables:
  catalog:
    description: Environment-specific Unity Catalog catalog
  processor_application_id:
    description: Processing service principal application ID
  evaluator_application_id:
    description: Evaluation service principal application ID
  processing_schedule_pause_status:
    description: Pause status for the periodic processing job schedule
    default: PAUSED

sync:
  exclude:
    - .codex/**
    - .github/**
    - docs/**
    - provisioning/**
    - scripts/**
    - tests/**

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: production
    variables:
      catalog: ledgerlens_dev
  demo:
    mode: production
    variables:
      catalog: ledgerlens_demo
