resources:
  jobs:
    process:
      name: ledgerlens-${bundle.target}-process
      run_as:
        service_principal_name: ${var.processor_application_id}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: '0 0 9 * * ?'
        timezone_id: UTC
        pause_status: ${var.processing_schedule_pause_status}
      environments:
        - environment_key: standard
          spec:
            environment_version: '6'
            dependencies:
              - pdfplumber==0.11.10
              - pypdf==7.0.1
              - pypdfium2==5.15.0
              - reportlab==5.1.1
      tasks:
        - task_key: bootstrap
          environment_key: standard
          spark_python_task:
            python_file: ../src/ledgerlens/bootstrap_job.py
            parameters: [process, '${var.catalog}', '{{job.trigger.type}}']

    evaluate:
      name: ledgerlens-${bundle.target}-evaluate
      run_as:
        service_principal_name: ${var.evaluator_application_id}
      max_concurrent_runs: 1
      queue:
        enabled: true
      environments:
        - environment_key: standard
          spec:
            environment_version: '6'
      tasks:
        - task_key: bootstrap
          environment_key: standard
          spark_python_task:
            python_file: ../src/ledgerlens/bootstrap_job.py
            parameters: [evaluate, '${var.catalog}', '{{job.trigger.type}}']
